<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Satellite Visualization</title>
    <meta name="author" content="Kaifun Shen" />
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Title -->
    <h1>Satellite Visualization</h1>

    <!-- Controls -->
    <div class="controls">
        <label for="owner-select">Satellite Owner:</label>
        <select id="owner-select">
            <option value="">Select a Owner/Country to plot</option>
        </select>
    </div>

    <!-- visualization -->
    <div id="viz"></div>

    <div id="leo-viz" class="zoom-viz"></div>

    <div id="meo-viz" class="zoom-viz"></div>

    <div class="controls">
        <label for="geo-select">GEO Satellite Owner:</label>
        <select id="geo-select">
            <option value="">Select an Owner/Country to plot</option><!-- a modifier mdr -->
        </select>
    </div>
    <div id="geo-viz" class="geo-container"></div>

    <!-- JS -->
    <script src="script.js"></script>

</body>
</html>
